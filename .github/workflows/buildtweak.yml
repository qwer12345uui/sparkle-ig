name: Build Sparkle tweak for Rootless (no FFmpeg)

# Rootless .deb build that does NOT bundle FFmpegKit (small package, ~1.3 MB),
# matching the IG 333.1.4 / iOS 15 line. Triggers automatically on push to
# main; can also be run manually.
#
# OBSERVABILITY: every run (success OR failure) commits the FULL build log plus
# a status marker to the `builds` branch. This makes the outcome readable
# without the Actions UI and without relying on Issues (which proved
# unreliable). On success the produced .deb is also committed to `builds`.
#
# A job timeout ensures a stuck build surfaces instead of hanging for hours.
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress runs: a queued run that gets cancelled by a new
  # push can never reach a runner. Let runs finish so the .deb is actually produced.
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Sparkle Rootless (no-FFmpeg)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Initialize build log
        run: |
          : > /tmp/build.log

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make 2>&1 | tee -a /tmp/build.log

      - name: Set PATH for GNU make
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          # Pinned to a known-good commit used by upstream 1.3.1.
          ref: 405e5c6ddb288615c030eeaedc6b265aae748285
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: iPhoneOS16.2.sdk-v1
          restore-keys: iPhoneOS16.2.sdk

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/ 2>&1 | tee -a /tmp/build.log
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS16.2.sdk 2>&1 | tee -a /tmp/build.log
          git checkout 2>&1 | tee -a /tmp/build.log
          mv *.sdk "$THEOS/sdks" 2>&1 | tee -a /tmp/build.log
          echo "=== sdks present ==="
          ls -la "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Get Sparkle Version
        id: sparkle_version
        run: |
          SPARKLE_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "SPARKLE_VERSION=${SPARKLE_VERSION}" >> "$GITHUB_ENV"
          echo "version=${SPARKLE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build rootless deb (no FFmpeg)
        id: build
        continue-on-error: true
        run: |
          set +e
          cd main
          make clean
          rm -rf .theos
          make package THEOS_PACKAGE_SCHEME=rootless SPARKLE_NO_FFMPEG=1 FINALPACKAGE=1 2>&1 | tee -a /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT=${BUILD_EXIT}" >> "$GITHUB_OUTPUT"
          echo "make exit code: ${BUILD_EXIT}"
          ls -la packages || true
          exit 0
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Publish log + status (+ deb on success) to builds branch
        if: always()
        run: |
          set +e
          EXIT="${{ steps.build.outputs.BUILD_EXIT }}"
          if [ "${EXIT:-x}" = "0" ]; then STATE=success; else STATE=failed; fi
          cd main
          git config user.email "ci@sparkle.local"
          git config user.name "Sparkle CI"
          cp /tmp/build.log ./build_log.txt 2>/dev/null || echo "(no build.log captured)" > ./build_log.txt
          cat > last_build.json <<JSON
          {"status":"${STATE}","version":"${SPARKLE_VERSION}","build_exit":"${EXIT}","run_id":"${GITHUB_RUN_ID}","commit":"${GITHUB_SHA}","date":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          JSON
          git add -f build_log.txt last_build.json
          if [ "${EXIT:-x}" = "0" ]; then
            cd packages
            SRC="$(ls -t com.sparkle.sparkle_*.deb 2>/dev/null | head -n1)"
            if [ -n "$SRC" ]; then
              DEST="Sparkle_v${SPARKLE_VERSION}_rootless_ig333.1.4.deb"
              mv -f "$SRC" "$DEST"
              cp -f "$DEST" "../${DEST}"
              cd ..
              git add -f "${DEST}"
              echo "Produced and staged: ${DEST}"
            else
              echo "Build reported success but no .deb found in packages/"
            fi
          fi
          git commit -m "ci: ${STATE} — run ${GITHUB_RUN_ID} [skip ci]" || echo "nothing to commit"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/qwer12345uui/sparkle-ig.git"
          git push --force origin HEAD:refs/heads/builds
          echo "Pushed status to builds branch (state=${STATE})"

      - name: Report status to Issue (secondary signal)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          EXIT="${{ steps.build.outputs.BUILD_EXIT }}"
          if [ "${EXIT:-x}" = "0" ]; then STATE=SUCCESS; else STATE=FAILED; fi
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LOG="(no build log captured)"
          if [ -f /tmp/build.log ]; then LOG="$(tail -n 60 /tmp/build.log)"; fi
          BODY=$(printf 'State: %s\nCommit: %s\nRun: %s\nDate: %s\n\nBuild log tail (last 60 lines):\n%s' "$STATE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DATE" "$LOG")
          gh issue create --title "CI build ${STATE} (run ${GITHUB_RUN_ID})" --body "$BODY" || echo "issue create failed (non-fatal)"
