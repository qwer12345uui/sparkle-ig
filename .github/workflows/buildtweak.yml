name: Build Sparkle tweak for Rootless (no FFmpeg)

# Rootless .deb build that does NOT bundle FFmpegKit (small package, ~1.3 MB),
# matching the IG 333.1.4 / iOS 15 line. Triggers automatically on push to
# main; can also be run manually. Build result + log tail are posted to a GitHub
# Issue (readable without the Actions UI) and the built .deb is committed to the
# `builds` branch so the outcome is always observable. A job timeout ensures a
# stuck build surfaces quickly instead of hanging for hours.
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress runs: a queued run that gets cancelled by a new
  # push can never reach a runner. Let runs finish so the .deb is actually produced.
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Sparkle Rootless (no-FFmpeg)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH for GNU make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          # Pinned to a known-good commit (Logos a623700) used by upstream 1.3.1.
          ref: 405e5c6ddb288615c030eeaedc6b265aae748285
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: iPhoneOS16.2.sdk
          restore-keys: iPhoneOS16.2.sdk

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS16.2.sdk
          git checkout
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Get Sparkle Version
        id: sparkle_version
        run: |
          SPARKLE_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "SPARKLE_VERSION=${SPARKLE_VERSION}" >> "$GITHUB_ENV"
          echo "version=${SPARKLE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build rootless deb (no FFmpeg)
        id: build
        continue-on-error: true
        run: |
          set +e
          cd main
          make clean
          rm -rf .theos
          make package THEOS_PACKAGE_SCHEME=rootless SPARKLE_NO_FFMPEG=1 FINALPACKAGE=1 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT=${BUILD_EXIT}" >> "$GITHUB_OUTPUT"
          echo "make exit code: ${BUILD_EXIT}"
          ls -la packages || true
          exit 0
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload build log on failure
        if: steps.build.outputs.BUILD_EXIT != '0'
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: /tmp/build.log

      - name: Rename deb
        id: package_name
        if: steps.build.outputs.BUILD_EXIT == '0'
        run: |
          cd main/packages
          SRC="$(ls -t com.sparkle.sparkle_*.deb | head -n1)"
          DEST="Sparkle_v${SPARKLE_VERSION}_rootless_ig333.1.4.deb"
          mv -f "$SRC" "$DEST"
          echo "package=${DEST}" >> "$GITHUB_OUTPUT"
          echo "Produced: $DEST"

      - name: Upload deb artifact
        if: steps.build.outputs.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_name.outputs.package }}
          path: ${{ github.workspace }}/main/packages/${{ steps.package_name.outputs.package }}
          if-no-files-found: error

      - name: Publish deb + marker to builds branch
        if: steps.build.outputs.BUILD_EXIT == '0'
        run: |
          cd main
          git config user.email "ci@sparkle.local"
          git config user.name "Sparkle CI"
          DEB="Sparkle_v${SPARKLE_VERSION}_rootless_ig333.1.4.deb"
          cp "packages/${DEB}" "${DEB}"
          cat > last_build.json <<JSON
          {"status":"success","version":"${SPARKLE_VERSION}","deb":"${DEB}","run_id":"${GITHUB_RUN_ID}","commit":"${GITHUB_SHA}","date":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          JSON
          git add "${DEB}" last_build.json
          git commit -m "ci: build success — ${DEB} [skip ci]" || true
          git push --force origin HEAD:refs/heads/builds

      - name: Report status to Issue (always)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          EXIT="${{ steps.build.outputs.BUILD_EXIT }}"
          if [ "${EXIT:-x}" = "0" ]; then STATE=SUCCESS; else STATE=FAILED; fi
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LOG="(no build log captured)"
          if [ -f /tmp/build.log ]; then LOG="$(tail -n 50 /tmp/build.log)"; fi
          BODY=$(printf 'State: %s\nCommit: %s\nRun: %s\nDate: %s\n\nBuild log tail (last 50 lines):\n%s' "$STATE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DATE" "$LOG")
          gh issue create --title "CI build ${STATE} (run ${GITHUB_RUN_ID})" --body "$BODY" || echo "issue create failed"
