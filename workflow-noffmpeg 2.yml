name: Build Sparkle tweak (rootless, no FFmpeg)

# 精简版：不含 FFmpeg 框架，产物约 1.3 MB，贴近旧版 Sparkle_v1.2.0 的包体。
# 代价：媒体转码/合并相关功能不可用。
#
# 用法：把本文件放进 fork 仓库的 .github/workflows/ ，
#       然后在 Actions 页面选中它 → Run workflow。

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Sparkle Rootless (no-ffmpeg)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main
          submodules: recursive

      # 精简版不需要编译 FFmpegKit，依赖大幅减少，构建快很多
      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH for GNU make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          # 与上游保持一致：钉住已知可用提交，避开 Logos 对裸 %orig 的回归
          ref: 405e5c6ddb288615c030eeaedc6b265aae748285
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iPhoneOS16.2.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS16.2.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Get Sparkle Version
        id: sparkle_version
        run: |
          SPARKLE_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "SPARKLE_VERSION=${SPARKLE_VERSION}" >> "$GITHUB_ENV"
          echo "version=${SPARKLE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build rootless deb without FFmpeg
        run: |
          cd main
          make clean
          rm -rf .theos
          make package THEOS_PACKAGE_SCHEME=rootless SPARKLE_NO_FFMPEG=1 DEBUG=0 FINALPACKAGE=1
          ls -la packages
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Rename deb
        id: package_name
        run: |
          cd main/packages
          SRC="$(ls -t com.sparkle.sparkle_*.deb | head -n1)"
          DEST="Sparkle_v${SPARKLE_VERSION}_rootless_no-ffmpeg.deb"
          mv -f "$SRC" "$DEST"
          echo "package=${DEST}" >> "$GITHUB_OUTPUT"
          echo "产出: $DEST"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_name.outputs.package }}
          path: ${{ github.workspace }}/main/packages/${{ steps.package_name.outputs.package }}
          if-no-files-found: error
